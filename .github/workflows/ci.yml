name: CI

# 只构建 Windows x64 便携包: 根目录是启动器 `quiet_md.exe` 与 `portable` 标记,
# 程序本体在 `Program/`,用户文件在 `Data/`。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows x64 portable build
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install toolchain
        run: rustup component add clippy

      - name: Build and check with Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools were not found' }
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          & python scripts/check.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows checks failed' }
          & scripts/package-windows.ps1 -Portable -SkipInstaller
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }

      - name: Upload Windows portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-portable
          path: |
            dist/windows/unsigned/quiet-md-*-windows-x64-portable.zip
            dist/windows/unsigned/quiet-md-*-windows-x64-portable.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # 推送 main 或 v* 标签时,把便携 zip 发成 GitHub Release (PR 只构建不发布)。
  release:
    name: Publish GitHub Release
    needs: windows-portable
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-portable
          path: dist

      - name: Version
        id: version
        run: echo "version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Quiet.md ${{ steps.version.outputs.version }}
          files: |
            dist/quiet-md-*-windows-x64-portable.zip
            dist/quiet-md-*-windows-x64-portable.zip.sha256

